<!doctype html>
<html lang="ar" dir="rtl" class="pp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1324">
  <meta name="color-scheme" content="dark">
  <title>Pocket Pager: طلبك جاهز في جيبك</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!--SHARE_META-->
  <meta name="description" content="العميل يمسح كود، ياخد رقم، وموبايله يرن أول ما طلبه يجهز. من غير تطبيق ولا أجهزة.">
  <link rel="preload" href="/fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pp-tokens.css">
  <link rel="stylesheet" href="/css/landing.css">
  <script type="module" src="/js/powered.js"></script>
</head>
<body class="landing">
  <main class="hero">
    <!-- The app tile, drawn inline so its signal waves can buzz once, like a pager. -->
    <svg class="hero-tile" viewBox="0 0 240 240" width="120" height="120" role="img" aria-label="Pocket Pager">
      <defs>
        <linearGradient id="pp-tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA024"/><stop offset=".52" stop-color="#FF6A13"/><stop offset="1" stop-color="#EE4510"/></linearGradient>
        <radialGradient id="pp-tgh" cx=".28" cy=".18" r=".6"><stop offset="0" stop-color="#FFD678" stop-opacity=".55"/><stop offset="1" stop-color="#FFD678" stop-opacity="0"/></radialGradient>
        <radialGradient id="pp-tgs" cx=".85" cy=".95" r=".7"><stop offset="0" stop-color="#C82800" stop-opacity=".45"/><stop offset="1" stop-color="#C82800" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="240" height="240" rx="67.2" fill="url(#pp-tg)"/>
      <rect width="240" height="240" rx="67.2" fill="url(#pp-tgh)"/>
      <rect width="240" height="240" rx="67.2" fill="url(#pp-tgs)"/>
      <g transform="translate(10 10) scale(1.1)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path class="wave wave-start" d="M150 74 q12 26 0 52" stroke-width="9"/>
        <path class="wave wave-end" d="M50 74 q-12 26 0 52" stroke-width="9"/>
        <g class="pager">
          <rect x="70" y="42" width="60" height="116" rx="23" stroke-width="9.5"/>
          <path d="M87 83 l9 9 l17 -18" stroke-width="10"/>
          <circle cx="100" cy="132" r="7.5" fill="#fff" stroke="none"/>
        </g>
      </g>
    </svg>

    <h1 class="hero-name"><img src="/img/brand/wordmark-on-dark.svg" alt="Pocket Pager" width="197" height="40"></h1>
    <p class="hero-tagline">طلبك جاهز في جيبك</p>
    <p class="hero-lede">امسح الكود اللي عند الكاشير بكاميرا موبايلك. رقمك هيظهر على طول، وموبايلك هيرن أول ما طلبك يجهز.</p>
  </main>

  <section class="for-shops" aria-labelledby="shops-title">
    <div class="for-shops-text">
      <h2 id="shops-title">عندك كافيه أو مطعم؟</h2>
      <p>عملاءك ياخدوا رقم من موبايلهم، من غير تطبيق ولا جهاز يرن في إيدهم. والكاشير يدوس على الرقم بس.</p>
    </div>
    <a class="btn btn-primary for-shops-cta" href="/demo">جرّب الديمو</a>
  </section>
</body>
</html>
