name: Google Play app

# Builds Pocket Pager for Google Play (apps/play): a signed .aab, checked by bundletool.
# On a PR that touches apps/play it proves the build; by hand (Actions > Google Play app > Run)
# it builds the bundle to upload. Signing: the upload key, from these secrets (without them the
# bundle is signed with a throwaway key, good for checks only):
#   PLAY_UPLOAD_KEYSTORE   the .jks, base64 (base64 -w0 upload.jks)
#   PLAY_KEY_ALIAS         its alias
#   PLAY_KEY_PASSWORD      its password (store and key)
on:
  pull_request:
    paths:
      - 'apps/play/**'
      - '.github/workflows/play-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS: "36.0.0"
  PLATFORM: "android-36"
  BUNDLETOOL_VERSION: "1.17.2"

jobs:
  bundle:
    name: Play - build and check the .aab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK packages and bundletool
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
      - name: Upload key
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PLAY_UPLOAD_KEYSTORE is not set: the bundle is signed with a throwaway key (not for upload)"
          fi
      - name: Build
        env:
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar" \
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS" \
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" \
            bash apps/play/build.sh "$RUNNER_TEMP/pocket-pager.aab"
      - name: Check what Google Play will read
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$RUNNER_TEMP/pocket-pager.aab" | tee "$RUNNER_TEMP/manifest.xml"
          grep -q 'package="cc.aurexis.pocketpager"' "$RUNNER_TEMP/manifest.xml"
          grep -q 'android:targetSdkVersion="36"' "$RUNNER_TEMP/manifest.xml"
          if grep -q 'REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/manifest.xml"; then echo "::error::no install permission on Play"; exit 1; fi
          # A phone's APK from the bundle, as Play would serve it, must read right.
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$RUNNER_TEMP/pocket-pager.aab" \
            --output="$RUNNER_TEMP/universal.apks" --mode=universal
          unzip -o -q "$RUNNER_TEMP/universal.apks" universal.apk -d "$RUNNER_TEMP"
          "$BT/aapt2" dump badging "$RUNNER_TEMP/universal.apk" | tee "$RUNNER_TEMP/badging.txt" | head -12
          grep -q "application-label:'Pocket Pager'" "$RUNNER_TEMP/badging.txt"
          grep -q "launchable-activity: name='cc.aurexis.pocketpager.MainActivity'" "$RUNNER_TEMP/badging.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-pager-play
          path: |
            ${{ runner.temp }}/pocket-pager.aab
            ${{ runner.temp }}/universal.apk
          if-no-files-found: error
