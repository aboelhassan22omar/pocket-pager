name: Google Play app

# Builds Pocket Pager for Google Play (apps/play): a signed .aab, checked by bundletool.
# On a PR that touches apps/play it proves the build with a throwaway key (a PR never sees the
# upload key). By hand from main (Actions > Google Play app > Run) the release job builds the
# bundle to upload, signed with the upload key: it runs in the production environment (approval),
# where these secrets live:
#   PLAY_UPLOAD_KEYSTORE   the .jks, base64 (base64 -w0 upload.jks)
#   PLAY_KEY_ALIAS         its alias
#   PLAY_KEY_PASSWORD      its password (store and key)
on:
  pull_request:
    paths:
      - 'apps/play/**'
      - 'server/src/**'
      - '.github/workflows/play-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS: "36.0.0"
  PLATFORM: "android-36"
  BUNDLETOOL_VERSION: "1.17.2"

jobs:
  bundle:
    name: Play - build and check the .aab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK packages and bundletool
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
      - name: Build (throwaway key)
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar" \
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS" \
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" \
            bash apps/play/build.sh "$RUNNER_TEMP/pocket-pager.aab"
      - name: Check what Google Play will read
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$RUNNER_TEMP/pocket-pager.aab" | tee "$RUNNER_TEMP/manifest.xml"
          grep -q 'package="cc.aurexis.pocketpager"' "$RUNNER_TEMP/manifest.xml"
          grep -q 'android:targetSdkVersion="36"' "$RUNNER_TEMP/manifest.xml"
          if grep -q 'REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/manifest.xml"; then echo "::error::no install permission on Play"; exit 1; fi
          # A phone's APK from the bundle, as Play would serve it, must read right. It is also the
          # copy to try on a phone before uploading (signed with a test key: install by hand only).
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias test -storepass testtest -keypass testtest \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Pocket Pager test" >/dev/null 2>&1
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$RUNNER_TEMP/pocket-pager.aab" \
            --output="$RUNNER_TEMP/universal.apks" --mode=universal \
            --ks="$RUNNER_TEMP/test.jks" --ks-key-alias=test --ks-pass=pass:testtest --key-pass=pass:testtest
          unzip -o -q "$RUNNER_TEMP/universal.apks" universal.apk -d "$RUNNER_TEMP"
          "$BT/apksigner" verify --min-sdk-version 24 "$RUNNER_TEMP/universal.apk"
          cp "$RUNNER_TEMP/universal.apk" "$RUNNER_TEMP/pocket-pager-try.apk"
          "$BT/aapt2" dump badging "$RUNNER_TEMP/universal.apk" | tee "$RUNNER_TEMP/badging.txt" | head -12
          grep -q "application-label:'Pocket Pager'" "$RUNNER_TEMP/badging.txt"
          grep -q "launchable-activity: name='cc.aurexis.pocketpager.MainActivity'" "$RUNNER_TEMP/badging.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-pager-play
          path: |
            ${{ runner.temp }}/pocket-pager.aab
            ${{ runner.temp }}/pocket-pager-try.apk
          if-no-files-found: error

  release:
    name: Play - the signed .aab to upload
    # By hand, from main, after approval: only this job can read the upload key.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: bundle
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK packages and bundletool
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar"             "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
      - name: Upload key
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE" ]; then echo "::error::PLAY_UPLOAD_KEYSTORE is not set in the production environment"; exit 1; fi
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build (upload key)
        env:
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar"           BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS"           BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"             bash apps/play/build.sh "$RUNNER_TEMP/pocket-pager.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-pager-play-signed
          path: ${{ runner.temp }}/pocket-pager.aab
          if-no-files-found: error

  emulator:
    name: Play - the managers' app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: http://127.0.0.1:3000
      SHOTS: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: SDK packages and bundletool
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
      - name: A test build pointed at the local server
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar" BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS" \
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" SERVER="$BASE" bash apps/play/build.sh "$RUNNER_TEMP/test.aab"
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -alias t -storepass testtest -keypass testtest \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=test" > /dev/null 2>&1
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$RUNNER_TEMP/test.aab" --output="$RUNNER_TEMP/test.apks" \
            --mode=universal --ks="$RUNNER_TEMP/t.jks" --ks-key-alias=t --ks-pass=pass:testtest --key-pass=pass:testtest
          unzip -o -q "$RUNNER_TEMP/test.apks" universal.apk -d "$RUNNER_TEMP"
      - name: Server (review brand, alerts every 2s)
        working-directory: server
        run: |
          npm ci --omit=dev
          HASH=$(node -e "import('./src/auth.js').then(async (m) => console.log(await m.hashPin('super-pass-ci')))")
          mkdir -p "$RUNNER_TEMP/data"
          PORT=3000 HOST=127.0.0.1 PUBLIC_URL="$BASE" DATA_DIR="$RUNNER_TEMP/data" REVIEW_ACCOUNT=on REVIEW_PASSWORD=Review-ci-1 \
            ALERTS_INTERVAL_SECONDS=2 SUPER_PASSWORD_HASH="$HASH" PAY_WHATSAPP=01043833456 LOG_LEVEL=warn \
            nohup node --disable-warning=ExperimentalWarning src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fs "$BASE/health" && break; sleep 1; done
          curl -fs -c "$RUNNER_TEMP/su.txt" -H 'content-type: application/json' -d '{"password":"super-pass-ci"}' "$BASE/api/super/login" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/play/e2e.sh "$RUNNER_TEMP/universal.apk" "$BASE" "$RUNNER_TEMP"
      - name: Server log
        if: always()
        run: tail -50 "$RUNNER_TEMP/server.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: play-app-run
          path: ${{ env.SHOTS }}
