name: iOS app on a simulator

# The managers' app, end to end on a real iOS simulator against a local server (the review brand):
# sign in, the branches, a branch, alerts, management, account; still signed in after the app is
# closed and after the phone restarts; a change on the server showing up live; a push; a branch
# manager seeing one branch; a stopped account sent back to sign-in. A screenshot per step
# (artifact ios-app-run). Runs on PRs that touch ios/ or the server, and by hand.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'server/src/**'
      - '.github/workflows/ios-screens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: iOS - the managers' app on a simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BASE: http://127.0.0.1:3000
      SHOTS: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Server (review brand, alerts every 2s)
        working-directory: server
        run: |
          npm ci --omit=dev
          HASH=$(node -e "import('./src/auth.js').then(async (m) => console.log(await m.hashPin('super-pass-ci')))")
          mkdir -p "$RUNNER_TEMP/data"
          PORT=3000 HOST=127.0.0.1 PUBLIC_URL="$BASE" DATA_DIR="$RUNNER_TEMP/data" REVIEW_ACCOUNT=on REVIEW_PASSWORD=Review-ci-1 \
            ALERTS_INTERVAL_SECONDS=2 SUPER_PASSWORD_HASH="$HASH" PAY_WHATSAPP=01043833456 LOG_LEVEL=warn \
            nohup node --disable-warning=ExperimentalWarning src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fs "$BASE/health" && break; sleep 1; done
          curl -fs -c "$RUNNER_TEMP/su.txt" -H 'content-type: application/json' -d '{"password":"super-pass-ci"}' "$BASE/api/super/login" > /dev/null
      - name: Select newest Xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$latest"
      - name: Build the app for a simulator
        working-directory: ios
        run: |
          brew install xcodegen > /dev/null
          PAGER_DOMAIN=pager.aurexis.cc ALLOW_XCODE_26=1 bash generate.sh
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = [d for d in devices if "Pro Max" in d["name"]] or [d for d in devices if "iPhone" in d["name"]]
          print(pick[-1]["udid"])')
          echo "SIM=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          set -o pipefail
          xcodebuild -project PocketPager.xcodeproj -scheme PocketPager -configuration Debug \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet
          echo "APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'PocketPager.app' | head -1)" >> "$GITHUB_ENV"
      - name: Run it, step by step
        run: |
          set -euo pipefail
          mkdir -p "$SHOTS"
          A=cc.aurexis.pager
          shot() { sleep "${2:-6}"; xcrun simctl io "$SIM" screenshot "$SHOTS/$1.png" > /dev/null; echo "shot $1"; }
          launch() { xcrun simctl terminate "$SIM" $A > /dev/null 2>&1 || true; xcrun simctl launch "$SIM" $A -ppBase "$BASE" "$@" > /dev/null; }
          owner_api() { curl -fs -b "$RUNNER_TEMP/owner.txt" -c "$RUNNER_TEMP/owner.txt" -H 'content-type: application/json' "$@"; }
          xcrun simctl status_bar "$SIM" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$SIM" "$APP"
          brew tap wix/brew > /dev/null && brew trust wix/brew > /dev/null && brew install applesimutils > /dev/null
          allow() { applesimutils --byId "$1" --bundle $A --setPermissions notifications=YES > /dev/null; }
          allow "$SIM"

          # The owner on the server side too (to make changes the app should show live).
          curl -fs -c "$RUNNER_TEMP/owner.txt" -H 'content-type: application/json' \
            -d '{"login":"01099990001","password":"Review-ci-1"}' "$BASE/api/login" > /dev/null
          owner_api -d '{"paused":true}' "$BASE/api/brand/review-cafe/branches/review-cafe-zamalek/settings" > /dev/null
          owner_api -d '{"paused":false}' "$BASE/api/brand/review-cafe/branches/review-cafe-zamalek/settings" > /dev/null

          launch; shot 01-sign-in
          launch -ppLogin 01099990001 -ppPassword Review-ci-1; shot 02-branches 10
          launch -ppTab 1; shot 03-alerts
          launch -ppTab 2; shot 04-management 12
          launch -ppTab 3; shot 05-account
          launch -ppBranch review-cafe-maadi; shot 06-branch

          # Stays signed in: the app closed and opened, then the phone restarted.
          launch; shot 07-reopened-still-signed-in
          xcrun simctl shutdown "$SIM"; xcrun simctl boot "$SIM"; xcrun simctl bootstatus "$SIM" -b
          launch; shot 08-after-phone-restart-still-signed-in 10

          # Live: an order taken on the server shows up without touching the app.
          launch; shot 09-live-before 8
          curl -fs -c "$RUNNER_TEMP/bar.txt" -H 'content-type: application/json' \
            -d '{"shopId":"review-cafe-maadi","pin":"1234"}' "$BASE/api/bar/login" > /dev/null
          K=$(curl -fs -b "$RUNNER_TEMP/bar.txt" "$BASE/api/bar/review-cafe-maadi/state" | python3 -c 'import json,sys,urllib.parse as u; print(u.parse_qs(u.urlparse(json.load(sys.stdin)["qr"]["staticUrl"]).query)["k"][0])')
          for i in 1 2; do
            curl -fs -H 'content-type: application/json' -H "x-client-id: ci-live-$i-xxxxxxxxxxxxxxxx" \
              -d "{\"k\":\"$K\"}" "$BASE/api/b/review-cafe-maadi/claim" > /dev/null
          done
          shot 10-live-after-two-new-orders 5

          # A push while the app is in the background.
          xcrun simctl launch "$SIM" com.apple.Preferences > /dev/null
          printf '{"aps":{"alert":{"title":"فرع الزمالك اتقفل مؤقتًا","body":"العملاء مش بياخدوا أرقام لحد ما يتفتح تاني."},"sound":"default"}}' > "$RUNNER_TEMP/push.json"
          xcrun simctl push "$SIM" $A "$RUNNER_TEMP/push.json"; shot 11-push 3

          # A branch manager: one branch only. Then the super stops the account: back to sign-in.
          xcrun simctl uninstall "$SIM" $A; xcrun simctl install "$SIM" "$APP"; allow "$SIM"
          launch -ppLogin 01099990002 -ppPassword Review-ci-1; shot 12-manager-one-branch 10
          MID=$(curl -fs -b "$RUNNER_TEMP/su.txt" "$BASE/api/super/overview" | python3 -c '
          import json, sys
          b = [x for x in json.load(sys.stdin)["brands"] if x["id"] == "review-cafe"][0]
          print([o for o in b["owners"] if o["username"] == "01099990002"][0]["id"])')
          curl -fs -b "$RUNNER_TEMP/su.txt" -H 'content-type: application/json' -d '{"disabled":true}' "$BASE/api/super/owners/$MID/disable" > /dev/null
          launch; shot 13-stopped-account-back-to-sign-in 10
          ls -la "$SHOTS"
      - name: iPad (App Store screenshots)
        run: |
          set -euo pipefail
          A=cc.aurexis.pager
          ipad=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = [d for d in devices if "iPad Pro" in d["name"] and "13" in d["name"]] or [d for d in devices if "iPad" in d["name"]]
          print(pick[-1]["udid"])')
          xcrun simctl boot "$ipad"; xcrun simctl bootstatus "$ipad" -b
          xcrun simctl status_bar "$ipad" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3
          xcrun simctl install "$ipad" "$APP"
          applesimutils --byId "$ipad" --bundle $A --setPermissions notifications=YES > /dev/null
          ishot() { sleep "${2:-8}"; xcrun simctl io "$ipad" screenshot "$SHOTS/ipad-$1.png" > /dev/null; }
          ilaunch() { xcrun simctl terminate "$ipad" $A > /dev/null 2>&1 || true; xcrun simctl launch "$ipad" $A -ppBase "$BASE" "$@" > /dev/null; }
          ilaunch; ishot 01-sign-in 6
          ilaunch -ppLogin 01099990001 -ppPassword Review-ci-1; ishot 02-branches 10
          ilaunch -ppBranch review-cafe-maadi; ishot 03-branch
          ilaunch -ppTab 1; ishot 04-alerts
          ilaunch -ppTab 2; ishot 05-management 12
      - name: Release build for devices (what the App Store gets)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project PocketPager.xcodeproj -scheme PocketPager -configuration Release             -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/rel"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet
          app=$(find "$RUNNER_TEMP/rel/Build/Products/Release-iphoneos" -maxdepth 1 -name 'PocketPager.app')
          plutil -extract CFBundleShortVersionString raw "$app/Info.plist" | tee /dev/stderr | grep -qx '1.2.0'
          plutil -extract CFBundleVersion raw "$app/Info.plist" | grep -qx '202611211'
          plutil -extract CFBundleIdentifier raw "$app/Info.plist" | grep -qx 'cc.aurexis.pager'
          # The App Clip and the Live Activity widgets are still inside.
          test -d "$app/AppClips/PocketPagerClip.app"
          test -d "$app/PlugIns/PocketPagerWidget.appex"
          test -d "$app/AppClips/PocketPagerClip.app/PlugIns/PocketPagerClipWidget.appex"
          plutil -extract NSSupportsLiveActivities raw "$app/AppClips/PocketPagerClip.app/Info.plist" | grep -qx true
          echo "Release app: 1.2.0 (202611211) with App Clip, widget and the Clip's Live Activity"
      - name: Server log
        if: always()
        run: tail -50 "$RUNNER_TEMP/server.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-app-run
          path: ${{ env.SHOTS }}
